# FAST profile: CPU-friendly, real MITSUI data, all 424 targets / 4 horizons evaluated
# (asset-factorised models make full target coverage cheap). Savings versus FULL come from a
# slower refit cadence, smaller hyper-parameter grids, one LSTM seed and a capped LSTM
# training sample -- NOT from dropping targets.
name: fast

split:
  refit_every: 126

models:
  - {name: hist_mean,   type: hist_mean}
  - {name: momentum_21, type: momentum}
  - {name: reversal_5,  type: reversal}
  - name: ridge
    type: ridge
    features: all
    grid: [{alpha: 1.0e+3}, {alpha: 1.0e+5}, {alpha: 1.0e+6}]
  - name: ridge_own
    type: ridge
    features: own
    grid: [{alpha: 1.0e+3}, {alpha: 1.0e+5}, {alpha: 1.0e+6}]
  - name: ridge_rawlabel          # design ablation: no cross-sectional demeaning of labels
    type: ridge
    features: all
    grid: [{alpha: 1.0e+3, label_mode: raw}, {alpha: 1.0e+5, label_mode: raw}, {alpha: 1.0e+6, label_mode: raw}]
  - name: lgbm
    type: lgbm
    features: all
    grid:
      - {n_estimators: 200, learning_rate: 0.03, num_leaves: 15, min_child_samples: 1000}
      - {n_estimators: 200, learning_rate: 0.03, num_leaves: 7,  min_child_samples: 3000}
  - name: lgbm_own
    type: lgbm
    features: own
    grid:
      - {n_estimators: 200, learning_rate: 0.03, num_leaves: 15, min_child_samples: 1000}
      - {n_estimators: 200, learning_rate: 0.03, num_leaves: 7,  min_child_samples: 3000}
  - name: lstm
    type: lstm
    features: all
    params: {window: 20, hidden: 32, dropout: 0.2, lr: 1.0e-3, batch_size: 512, max_epochs: 12, patience: 3,
             max_samples: 50000, val_len: 126, n_seeds: 1}
  - name: ridge_direct_pooled
    type: direct_ridge
    features: own
    grid: [{alpha: 1.0e+3, pooled: true}, {alpha: 1.0e+5, pooled: true}]
  - name: ridge_direct_target
    type: direct_ridge
    features: own
    grid: [{alpha: 1.0e+2, pooled: false}, {alpha: 1.0e+3, pooled: false}]

evaluation:
  bootstrap_reps: 500

runtime:
  max_minutes: 25
